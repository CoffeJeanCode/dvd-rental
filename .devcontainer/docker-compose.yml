services:
  # Contenedor de trabajo (terminal de Codespaces): cliente psql + el repositorio
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    # Comparte la red del servicio db: PostgreSQL queda en localhost:5432
    network_mode: service:db
    environment:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dvdrental
    depends_on:
      - db

  # PostgreSQL 16 con dvdrental restaurada (ver Dockerfile en la raíz)
  db:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dvdrental"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
